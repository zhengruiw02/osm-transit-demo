<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/osm-transit-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OSM City Transit Simulator — friend beta">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OSM City Transit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OSM City Transit</title>
  <link rel="manifest" href="manifest.json">

  <!-- Browser map libraries are vendored under web/vendor/ so the beta has no
       runtime dependency on a public JavaScript CDN. Bump the versions here
       and in vendor/README.md together. -->
  <link href="vendor/maplibre-gl.css" rel="stylesheet">
  <script src="vendor/pmtiles.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <!--
    MapLibre 5.24.0 evaluates the upstream OpenFreeMap road-shield filters with
    `["<=", ["get", "ref_length"], 6]`. HK/Shenzhen features omit that property,
    so the worker logs the non-fatal
    "Expected value to be of type number, but found null instead." twice per
    style load. Remove the three US-only shield layers synchronously on
    `style.load`; the Flutter onStyleLoaded callback runs a tick later, after
    the first render has already evaluated them. This is a narrow app-side
    suppression, not a patched vendored JS bundle.
  -->
  <script>
    (function () {
      if (!window.maplibregl || !maplibregl.Map) return;
      const UpstreamMap = maplibregl.Map;
      const warningLayerIds = [
        'highway-shield-non-us',
        'highway-shield-us-interstate',
        'road_shield_us',
      ];
      function PatchedMap(options) {
        const map = new UpstreamMap(options);
        map.on('style.load', function () {
          warningLayerIds.forEach(function (id) {
            try {
              if (map.getLayer(id)) map.removeLayer(id);
            } catch (_) {
              // A style replacement can be in flight; the next load retries.
            }
          });
        });
        return map;
      }
      Object.setPrototypeOf(PatchedMap, UpstreamMap);
      PatchedMap.prototype = UpstreamMap.prototype;
      maplibregl.Map = PatchedMap;
    })();
  </script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0b1320;
      color: #e7eef7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #boot-status {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      background: #0b1320;
      transition: opacity 250ms ease;
    }

    #boot-status.boot-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .boot-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #2d4666;
      border-top-color: #6fc3ff;
      border-radius: 50%;
      animation: boot-spin 900ms linear infinite;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }

    .boot-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    #boot-message {
      margin: 0;
      max-width: 30rem;
      font-size: 0.92rem;
      line-height: 1.45;
      color: #a9bdd4;
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite">
    <div class="boot-spinner" aria-hidden="true"></div>
    <p class="boot-title">OSM City Transit</p>
    <p id="boot-message">Loading the simulator…</p>
  </div>
  <noscript>
    <p style="padding: 24px;">This simulator needs JavaScript. Enable it and reload the page.</p>
  </noscript>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var status = document.getElementById('boot-status');
      var message = document.getElementById('boot-message');

      function hideBootStatus() {
        if (!status) return;
        status.classList.add('boot-hidden');
        window.setTimeout(function () {
          if (status && status.parentNode) status.parentNode.removeChild(status);
        }, 300);
      }

      window.addEventListener('flutter-first-frame', hideBootStatus, {once: true});

      window.setTimeout(function () {
        if (!status || !document.body.contains(status)) return;
        message.textContent = 'Still loading… The first load downloads the app and map ' +
          'style, which can take up to 25 seconds on mobile data. If it never finishes, ' +
          'reload the page.';
      }, 20000);

      // A missing script or stylesheet leaves Flutter without a map. Say so
      // instead of showing a white screen forever.
      window.addEventListener('error', function (event) {
        var target = event && event.target;
        if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
        if (message) {
          message.textContent = 'A required map library failed to load. Reload the page; ' +
            'if it keeps failing, the web build is incomplete.';
        }
      }, true);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
